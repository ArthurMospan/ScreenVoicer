name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['landing/**', 'branding/**', '**.md']
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build ScreenVoicer.csproj -c Release
