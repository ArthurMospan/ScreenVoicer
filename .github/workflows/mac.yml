name: macOS

# Builds and tests the Mac app on every push that touches mac/, and serves the release workflow
# (workflow_call) so a tag publishes the Windows and Mac assets together.
on:
  push:
    branches: ['**']
    paths: ['mac/**', '.github/workflows/mac.yml', 'CHANGELOG.md']
  pull_request:
    paths: ['mac/**']
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      HAS_CERT: ${{ secrets.MAC_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build, sign, pack
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          chmod +x mac/scripts/build.sh
          mac/scripts/build.sh "${{ inputs.version }}"

      - name: DMG (first installs; the updater keeps the zip)
        run: |
          chmod +x mac/scripts/dmg.sh
          mac/scripts/dmg.sh
          # what a user sees: the app, the «Applications» shortcut, the background and the window layout
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/sv-dmg mac/build/ScreenVoicer-macOS.dmg
          ls -la /tmp/sv-dmg /tmp/sv-dmg/.background
          test -d /tmp/sv-dmg/ScreenVoicer.app
          test "$(readlink /tmp/sv-dmg/Applications)" = "/Applications"
          test -f /tmp/sv-dmg/.DS_Store
          ls /tmp/sv-dmg/.background | grep -qi tiff
          codesign --verify --deep --strict /tmp/sv-dmg/ScreenVoicer.app
          hdiutil detach /tmp/sv-dmg

      - name: Same certificate on every build (permissions survive updates)
        if: env.HAS_CERT == 'true'
        run: |
          codesign -d -r- mac/build/ScreenVoicer.app 2>&1 | tee dr.txt
          grep -qi 'identifier "ua.com.mospan.screenvoicer"' dr.txt
          grep -qi 'H"15d381e51d5e41b6e5bf780ab8f9dd6f5946327c"' dr.txt

      - name: Whisper model cache
        uses: actions/cache@v4
        with:
          path: ~/sv-models
          key: whisper-base-v3

      - name: Self-test
        run: |
          say -o speech.aiff "Hello, this is a test of the screen voicer application. The save button does not work."
          afconvert -f WAVE -d LEI16@16000 -c 1 speech.aiff speech.wav
          export SV_DATA_DIR="$HOME/sv-data"
          mkdir -p "$SV_DATA_DIR" ~/sv-models
          ln -sfn ~/sv-models "$SV_DATA_DIR/models"
          mac/build/ScreenVoicer.app/Contents/MacOS/ScreenVoicer --selftest --model base --lang en --wav speech.wav --expect test

      - name: Snapshots
        if: always()
        run: |
          mac/build/ScreenVoicer.app/Contents/MacOS/ScreenVoicer --snapshots snapshots

      - name: UI test (real windows, capture, mouse and keys)
        if: always()
        timeout-minutes: 5
        run: |
          export SV_DATA_DIR="$HOME/sv-ui"
          mkdir -p "$SV_DATA_DIR"
          ln -sfn ~/sv-models "$SV_DATA_DIR/models"
          printf '{"OutputDirectory":"%s","PermissionsGuideShown":true}' "$SV_DATA_DIR/shots" > "$SV_DATA_DIR/settings.json"
          mac/build/ScreenVoicer.app/Contents/MacOS/ScreenVoicer --ui-test snapshots/ui

      - name: DMG window snapshot
        if: always()
        continue-on-error: true
        run: |
          open mac/build/ScreenVoicer-macOS.dmg
          sleep 8
          mkdir -p snapshots/ui
          screencapture -x snapshots/ui/real-dmg.png
          hdiutil detach "/Volumes/ScreenVoicer" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: snapshots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenVoicer-macOS
          path: |
            mac/build/ScreenVoicer-macOS.zip
            mac/build/ScreenVoicer-macOS.dmg
          if-no-files-found: error
