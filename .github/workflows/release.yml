name: Release

# Push a tag like v1.12.0 (with a matching "## 1.12.0" section in CHANGELOG.md) to publish a release with BOTH
# apps: ScreenVoicer-Setup.exe + the portable exe for Windows; ScreenVoicer-macOS.dmg (first installs, the site's
# button) + ScreenVoicer-macOS.zip (the Mac updater) for macOS. One version for both.
# A tag with a suffix (v1.12.0-beta.1) becomes a pre-release: the apps' updaters and the site ignore it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$v" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  windows:
    needs: meta
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ needs.meta.outputs.version }}

  mac:
    needs: meta
    uses: ./.github/workflows/mac.yml
    with:
      version: ${{ needs.meta.outputs.version }}
    secrets: inherit

  publish:
    needs: [meta, windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: assets

      - uses: actions/download-artifact@v4
        with:
          name: ScreenVoicer-macOS
          path: assets

      - name: Release notes from CHANGELOG.md
        run: |
          v="${{ needs.meta.outputs.version }}"
          base="${v%%-*}"
          awk -v head="## $base" '$0 == head {found = 1; next} /^## / {if (found) exit} found {print}' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "ScreenVoicer $v" > notes.md; fi
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la assets
          flags=""
          if [ "${{ needs.meta.outputs.prerelease }}" = "true" ]; then flags="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" assets/ScreenVoicer-Setup.exe assets/ScreenVoicer-portable.exe \
            assets/ScreenVoicer-macOS.zip assets/ScreenVoicer-macOS.dmg \
            --title "ScreenVoicer ${{ needs.meta.outputs.version }}" --notes-file notes.md $flags
