name: Release

# Push a tag like v1.11.0 (with a matching "## 1.11.0" section in CHANGELOG.md) to publish a release with BOTH
# apps: ScreenVoicer-Setup.exe + the portable exe for Windows, ScreenVoicer-macOS.zip for macOS. One version for both.
# A tag with a suffix (v1.11.0-beta.1) becomes a pre-release: the apps' updaters and the site ignore it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$v" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file exe
        run: dotnet publish ScreenVoicer.csproj -c Release -o publish -p:Version=${{ needs.meta.outputs.version }}

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DMyAppVersion=${{ needs.meta.outputs.version }} installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item installer_output\ScreenVoicer-Setup.exe out\
          Copy-Item publish\ScreenVoicer.exe out\ScreenVoicer-portable.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  mac:
    needs: meta
    uses: ./.github/workflows/mac.yml
    with:
      version: ${{ needs.meta.outputs.version }}
    secrets: inherit

  publish:
    needs: [meta, windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: assets

      - uses: actions/download-artifact@v4
        with:
          name: ScreenVoicer-macOS
          path: assets

      - name: Release notes from CHANGELOG.md
        run: |
          v="${{ needs.meta.outputs.version }}"
          base="${v%%-*}"
          awk -v head="## $base" '$0 == head {found = 1; next} /^## / {if (found) exit} found {print}' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "ScreenVoicer $v" > notes.md; fi
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la assets
          flags=""
          if [ "${{ needs.meta.outputs.prerelease }}" = "true" ]; then flags="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" assets/ScreenVoicer-Setup.exe assets/ScreenVoicer-portable.exe \
            assets/ScreenVoicer-macOS.zip \
            --title "ScreenVoicer ${{ needs.meta.outputs.version }}" --notes-file notes.md $flags
