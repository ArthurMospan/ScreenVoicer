name: Windows

# Builds the Windows app and its installer on every push that touches the installer, and serves the release
# workflow (workflow_call) so a tag publishes the Windows and Mac assets together.
on:
  push:
    branches: ['**']
    paths: ['installer.iss', 'installer/**', '.github/workflows/windows.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Version
        id: v
        shell: bash
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then v="$(grep -m1 -E '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed -E 's/^## //')"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Publish single-file exe
        run: dotnet publish ScreenVoicer.csproj -c Release -o publish -p:Version=${{ steps.v.outputs.version }}

      - name: Inno Setup 6.7.3 (the dark, branded wizard needs 6.7+)
        shell: pwsh
        timeout-minutes: 5
        run: |
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile innosetup.exe
          $hash = (Get-FileHash innosetup.exe -Algorithm SHA256).Hash
          if ($hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw "Unexpected Inno Setup download: $hash" }
          # portable mode into a private folder, beside whatever version the runner has; wait for this process only
          $dir = Join-Path $env:RUNNER_TEMP 'inno'
          $p = Start-Process innosetup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER','/PORTABLE=1',"/DIR=`"$dir`"" -PassThru
          $p.WaitForExit()
          if (-not (Test-Path "$dir\ISCC.exe")) { throw "Inno Setup did not install (exit $($p.ExitCode))" }
          "ISCC=$dir\ISCC.exe" >> $env:GITHUB_ENV

      - name: Build installer
        shell: pwsh
        run: |
          & $env:ISCC /DMyAppVersion=${{ steps.v.outputs.version }} installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item installer_output\ScreenVoicer-Setup.exe out\
          Copy-Item publish\ScreenVoicer.exe out\ScreenVoicer-portable.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error
